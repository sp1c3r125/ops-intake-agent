name: tests

on: push

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"      # same minor version as the local .venv
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest -q
